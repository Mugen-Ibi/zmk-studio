name: Windows fork build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'Mugen-Ibi/zmk-studio'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - run: npm ci
      - run: npm test -- --silent
      - name: Lint changed frontend and tests
        run: npx eslint src/behaviors/ParameterValuePicker.tsx src/behaviors/BehaviorBindingPicker.stories.ts src/keyboard/Keymap.tsx tests vitest.config.ts --ext ts,tsx --max-warnings 0
      - name: Build unsigned Windows x64 installer
        run: npm run tauri -- build --bundles nsis -- --locked
      - uses: actions/upload-artifact@v4
        with:
          name: zmk-studio-mugen-ibi-windows-x64
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            LICENSE
            NOTICE
