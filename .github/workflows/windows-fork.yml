name: Windows fork build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'Mugen-Ibi/zmk-studio'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - run: npm ci
      - run: npm test -- --silent
      - run: npm run lint
      - run: npm run typecheck
      - run: npm audit --audit-level=low
      - run: npm run build-storybook -- --disable-telemetry
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo install cargo-audit --locked --version 0.22.2
      - run: cargo audit --file src-tauri/Cargo.lock
      - name: Build unsigned Windows x64 installer
        run: npm run tauri -- build --bundles nsis -- --locked
      - uses: actions/upload-artifact@v4
        with:
          name: zmk-studio-mugen-ibi-windows-x64
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            LICENSE
            NOTICE
